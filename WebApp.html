<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose900:oklch(32% 0.10 350); --rose700:oklch(45% 0.15 350); --rose600:oklch(52% 0.17 350);
    --rose100:oklch(94% 0.035 350); --rose50:oklch(97.5% 0.018 350); --border:oklch(88% 0.05 350);
    --ink:oklch(23% 0.02 20); --muted:oklch(50% 0.02 20); --bg:oklch(97.3% 0.008 25);
    --green-bg:oklch(94% 0.05 150); --green-fg:oklch(38% 0.11 150);
    --amber-bg:oklch(94% 0.06 80); --amber-fg:oklch(42% 0.13 70);
    --red-bg:oklch(94% 0.045 25); --red-fg:oklch(42% 0.15 20);
    --grey-bg:oklch(93% 0.006 20); --grey-fg:oklch(45% 0.01 20);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);padding-bottom:60px}
  a{color:inherit}
  button{font-family:inherit}
  .header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--rose900),var(--rose700));color:#fff;padding:18px 28px;box-shadow:0 12px 30px rgba(76,5,25,.18)}
  .header-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .title{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .subtitle{font-size:12.5px;opacity:.82;margin-top:2px}
  .pill-group{display:flex;gap:4px;background:rgba(255,255,255,.14);padding:4px;border-radius:999px}
  .pill{border:0;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:rgba(255,255,255,.85)}
  .pill.active{background:#fff;color:var(--rose900);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 28px 0}
  .card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:16px}
  .toolbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  label.field-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  select,input,textarea{width:100%;margin-top:5px;padding:10px 12px;border:1px solid oklch(89% 0.02 20);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:90px;resize:vertical}
  .tabbar{display:flex;gap:6px;background:var(--rose50);padding:4px;border-radius:999px;border:1px solid var(--border);width:fit-content}
  .tab{border:0;padding:9px 15px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;background:transparent;color:var(--rose900)}
  .tab.active{background:var(--rose600);color:#fff;font-weight:700}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px}
  .stat-num{font-size:26px;font-weight:800}
  .stat-label{font-size:12.5px;color:var(--muted);margin-top:2px}
  .chip{display:inline-flex;border-radius:999px;padding:3px 9px;font-weight:700;font-size:11px;white-space:nowrap}
  .btn{border:0;background:var(--rose600);color:#fff;font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px;cursor:pointer}
  .btn-ghost{border:1px solid var(--border);background:#fff;color:oklch(38% 0.12 350);font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer}
  .btn-sm{border:0;background:var(--rose600);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .progress-track{height:8px;background:var(--rose100);border-radius:999px;overflow:hidden}
  .progress-fill{height:8px;background:var(--rose600)}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:10px 12px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left}
  td{padding:10px 12px;border-top:1px solid oklch(93% 0.01 20)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 14px 30px rgba(0,0,0,.25)}
  .empty{background:#fff;border:1px dashed var(--border);border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
  .ring{border-radius:999px;display:flex;align-items:center;justify-content:center}
  .ring-inner{background:#fff;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:18px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
  .sig-canvas{border:1px solid oklch(89% 0.02 20);border-radius:10px;touch-action:none;width:100%;height:120px;background:#fff}
  .link-btn{border:0;background:none;color:var(--rose600);font-weight:700;font-size:13px;cursor:pointer;padding:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATEGORIES = ['MINI_CEX','CBD','DOPS','COMMU'];
const STATUS_META = {
  COMPLETED:{label:'Completed',bg:'var(--green-bg)',fg:'var(--green-fg)'},
  PENDING:{label:'Pending review',bg:'var(--amber-bg)',fg:'var(--amber-fg)'},
  NOT_COMPLETED:{label:'Needs revision',bg:'var(--red-bg)',fg:'var(--red-fg)'},
  NOT_SUBMITTED:{label:'Not started',bg:'var(--grey-bg)',fg:'var(--grey-fg)'}
};

let BOOT = null;
let S = {
  role:'FELLOW', activeFellowId:'', activeFacultyId:'',
  fellowTab:'progress', facultyTab:'queue', adminTab:'overview',
  milestoneView:'cards', radialCategory:null,
  submitForm:{}, toast:null, adminModal:null, busy:false
};

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(text){ S.toast = text; render(); clearTimeout(window._toastTimer); window._toastTimer = setTimeout(()=>{ S.toast=null; render(); }, 3200); }
function setBusy(b){ S.busy = b; render(); }

function call(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(err))
      [fn](...args);
  });
}

function boot(){
  call('api_bootstrap').then(data => {
    BOOT = data;
    if (BOOT.fellows.length) S.activeFellowId = BOOT.fellows[0].id;
    if (BOOT.faculty.length) S.activeFacultyId = BOOT.faculty[0].id;
    resetSubmitForm();
    render();
  }).catch(err => {
    document.getElementById('app').innerHTML = '<div class="wrap"><div class="card">Failed to load: '+esc(err.message||err)+'</div></div>';
  });
}

function resetSubmitForm(){
  const fellow = BOOT.fellows.find(f=>f.id===S.activeFellowId);
  const category = CATEGORIES[0];
  const firstItem = BOOT.assessments.find(a=>a.category===category);
  S.submitForm = {
    fellowId: S.activeFellowId, trainingYear: fellow?fellow.year:'1', category,
    assessmentId: firstItem?firstItem.id:'', assessorId: BOOT.faculty[0]?BOOT.faculty[0].id:'',
    patientName:'', hn:'', diagnosis:'', caseDate:'', location:'', reflection:''
  };
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

function computeFellowDashboard(fellowId){
  const subs = BOOT.submissions.filter(s=>s.fellowId===fellowId);
  const byCategory = CATEGORIES.map(category => {
    const items = BOOT.assessments.filter(a=>a.category===category).map(a=>{
      const recs = subs.filter(s=>s.assessmentId===a.id);
      const graded = recs.filter(r=>r.status==='GRADED');
      const pending = recs.filter(r=>r.status==='PENDING');
      let status='NOT_SUBMITTED', latestResult='—', latestAssessor='—';
      if (category==='COMMU'){
        const passGraded = graded.filter(r=>r.globalResult==='PASS');
        if (passGraded.length >= (a.requiredPass||2)) status='COMPLETED';
        else if (pending.length) status='PENDING';
        else if (graded.length) status='NOT_COMPLETED';
        if (graded.length){ const last=graded[graded.length-1]; latestResult=last.globalResult; latestAssessor=last.assessorName||'—'; }
      } else {
        const passGraded = graded.filter(r=>Number(r.globalResult)>=BOOT.completionLevel);
        if (passGraded.length) status='COMPLETED';
        else if (pending.length) status='PENDING';
        else if (graded.length) status='NOT_COMPLETED';
        if (graded.length){ const last=graded[graded.length-1]; latestResult='Level '+last.globalResult; latestAssessor=last.assessorName||'—'; }
      }
      const meta = STATUS_META[status];
      return { id:a.id, subtype:a.subtype, title:a.title, status, meta, latestResult, latestAssessor,
        dot: status==='COMPLETED'?'✓':(status==='PENDING'?'…':(status==='NOT_COMPLETED'?'!':'·')) };
    });
    const completedCount = items.filter(i=>i.status==='COMPLETED').length;
    const percent = items.length ? Math.round(completedCount/items.length*100) : 0;
    return { category, label:BOOT.categoryLabel[category], items, completedCount, total:items.length, percent };
  });
  const total = byCategory.reduce((s,c)=>s+c.total,0);
  const completed = byCategory.reduce((s,c)=>s+c.completedCount,0);
  const pendingCount = byCategory.reduce((s,c)=>s+c.items.filter(i=>i.status==='PENDING').length,0);
  const notCompletedCount = byCategory.reduce((s,c)=>s+c.items.filter(i=>i.status==='NOT_COMPLETED').length,0);
  const percent = total ? Math.round(completed/total*100) : 0;
  return { fellowId, byCategory, total, completed, pendingCount, notCompletedCount, percent };
}

/* ---------- render ---------- */
function render(){
  if (!BOOT) return;
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + '<div class="wrap">' + renderToast() +
    (S.role==='FELLOW'?renderFellow():'') +
    (S.role==='FACULTY'?renderFaculty():'') +
    (S.role==='ADMIN'?renderAdmin():'') +
    '</div>' + renderModal();
  bindEvents();
}

function renderToast(){ return S.toast ? '<div class="toast">'+esc(S.toast)+'</div>' : ''; }

function renderHeader(){
  const roles=[['FELLOW','Fellow'],['FACULTY','Faculty'],['ADMIN','Admin']];
  return '<div class="header"><div class="header-inner">'+
    '<div><div class="title">Newborn EPA Tracker</div><div class="subtitle">Fellow-centered entrustable professional activity portfolio · Chula Neonatology</div></div>'+
    '<div class="pill-group">'+roles.map(r=>'<button data-role="'+r[0]+'" class="pill '+(S.role===r[0]?'active':'')+'">'+r[1]+'</button>').join('')+'</div>'+
    '</div></div>';
}

function fellowOptionsHtml(selected){
  return BOOT.fellows.map(f=>'<option value="'+f.id+'" '+(f.id===selected?'selected':'')+'>'+esc(f.name)+' · F'+esc(f.year)+'</option>').join('');
}
function facultyOptionsHtml(selected){
  return BOOT.faculty.map(f=>'<option value="'+f.id+'" '+(f.id===selected?'selected':'')+'>'+esc(f.name)+'</option>').join('');
}

/* ---------- Fellow ---------- */
function renderFellow(){
  if (!BOOT.fellows.length) return '<div class="empty">No fellows yet — add one from the Admin tab.</div>';
  const dash = computeFellowDashboard(S.activeFellowId);
  let html = '<div class="card toolbar">'+
    '<div style="flex:1;min-width:220px"><label class="field-label">Signed in as</label>'+
    '<select id="fellowSelect">'+fellowOptionsHtml(S.activeFellowId)+'</select></div>'+
    '<div class="tabbar">'+
      '<button data-fellowtab="progress" class="tab '+(S.fellowTab==='progress'?'active':'')+'">My Progress</button>'+
      '<button data-fellowtab="submit" class="tab '+(S.fellowTab==='submit'?'active':'')+'">Submit Assessment</button>'+
    '</div></div>';

  if (S.fellowTab==='progress') html += renderFellowProgress(dash);
  else html += renderSubmitForm();
  return html;
}

function renderFellowProgress(dash){
  const fellow = BOOT.fellows.find(f=>f.id===dash.fellowId) || {};
  let html = '<div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px">'+
    '<div><h1 style="font-size:24px;margin:0;font-weight:700">'+esc(fellow.name)+'</h1>'+
    '<div style="color:var(--muted);font-size:13.5px;margin-top:2px">Training year F'+esc(fellow.year)+' · '+dash.percent+'% of EPA portfolio complete</div></div>'+
    '<div class="tabbar">'+
      ['cards','roadmap','radial'].map(v=>'<button data-milestone="'+v+'" class="tab '+(S.milestoneView===v?'active':'')+'">'+({cards:'Category Cards',roadmap:'Roadmap',radial:'Radial Badges'}[v])+'</button>').join('')+
    '</div></div>';

  html += '<div class="stat-grid">'+
    '<div class="stat"><div class="stat-num" style="color:var(--rose900)">'+dash.percent+'%</div><div class="stat-label">Overall complete</div></div>'+
    '<div class="stat"><div class="stat-num" style="color:var(--green-fg)">'+dash.completed+'</div><div class="stat-label">Completed</div></div>'+
    '<div class="stat"><div class="stat-num" style="color:var(--amber-fg)">'+dash.pendingCount+'</div><div class="stat-label">Awaiting review</div></div>'+
    '<div class="stat"><div class="stat-num" style="color:var(--red-fg)">'+dash.notCompletedCount+'</div><div class="stat-label">Needs revision</div></div>'+
    '</div>';

  if (S.milestoneView==='cards') html += renderCards(dash);
  else if (S.milestoneView==='roadmap') html += renderRoadmap(dash);
  else html += renderRadial(dash);

  html += '<div class="card" style="margin-top:16px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'+
    '<div style="font-weight:700">Year-end portfolio</div>'+
    '<button id="btnExportPortfolio" class="btn-ghost">Export merged PDF</button></div></div>';
  return html;
}

function renderCards(dash){
  return '<div>'+dash.byCategory.map(cat=>'<div class="card">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px">'+
      '<div><div style="font-size:16px;font-weight:700">'+esc(cat.label)+'</div><div style="font-size:12.5px;color:var(--muted)">'+cat.completedCount+' / '+cat.total+' completed</div></div>'+
      '<div style="min-width:120px;text-align:right"><div style="font-weight:800;color:var(--rose900)">'+cat.percent+'%</div>'+
        '<div class="progress-track" style="margin-top:4px;width:120px"><div class="progress-fill" style="width:'+cat.percent+'%"></div></div></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px">'+
      cat.items.map(it=>'<div style="border:1px solid oklch(90% 0.02 20);border-radius:14px;padding:12px">'+
        '<span class="chip" style="background:'+it.meta.bg+';color:'+it.meta.fg+'">'+it.meta.label+'</span>'+
        '<div style="font-weight:700;margin-top:7px;font-size:13.5px">'+esc(it.subtype)+'</div>'+
        '<div style="color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4">'+esc(it.title)+'</div>'+
        '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted)">'+
          '<span>Latest: <b style="color:var(--ink)">'+esc(it.latestResult)+'</b></span><span>By '+esc(it.latestAssessor)+'</span></div>'+
      '</div>').join('')+
    '</div></div>').join('')+'</div>';
}

function renderRoadmap(dash){
  return '<div>'+dash.byCategory.map(cat=>'<div class="card">'+
    '<div style="font-weight:700;font-size:15px;margin-bottom:14px">'+esc(cat.label)+' <span style="font-weight:500;color:var(--muted);font-size:12.5px">— '+cat.completedCount+'/'+cat.total+'</span></div>'+
    '<div style="position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:0 6px;flex-wrap:wrap;gap:10px">'+
      cat.items.map(it=>'<div style="display:flex;flex-direction:column;align-items:center;width:96px;text-align:center">'+
        '<div style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:3px solid #fff;box-shadow:0 0 0 2px oklch(90% 0.02 20);background:'+it.meta.bg+';color:'+it.meta.fg+'">'+it.dot+'</div>'+
        '<div style="font-size:11px;font-weight:700;margin-top:8px">'+esc(it.subtype)+'</div>'+
        '<div style="font-size:10.5px;color:var(--muted);margin-top:2px">'+it.meta.label+'</div>'+
      '</div>').join('')+
    '</div></div>').join('')+'</div>';
}

function renderRadial(dash){
  const selected = S.radialCategory ? dash.byCategory.find(c=>c.category===S.radialCategory) : null;
  return '<div style="display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start">'+
    '<div class="card" style="display:flex;flex-direction:column;align-items:center;gap:10px">'+
      '<div class="ring" style="width:150px;height:150px;background:conic-gradient(var(--rose700) '+(dash.percent*3.6)+'deg, var(--rose100) 0)">'+
        '<div class="ring-inner" style="width:112px;height:112px"><div style="font-size:26px;font-weight:800;color:var(--rose900)">'+dash.percent+'%</div><div style="font-size:10.5px;color:var(--muted)">overall</div></div>'+
      '</div><div style="font-size:12px;color:var(--muted);text-align:center">Tap a badge to explore that category\'s EPAs</div>'+
    '</div>'+
    '<div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">'+
      dash.byCategory.map(cat=>'<button data-radial="'+cat.category+'" style="border:0;background:'+(S.radialCategory===cat.category?'#fff':'none')+';cursor:pointer;padding:8px;border-radius:16px;'+(S.radialCategory===cat.category?'box-shadow:0 4px 14px rgba(0,0,0,.08)':'')+'">'+
        '<div class="ring" style="width:76px;height:76px;margin:0 auto;background:conic-gradient(var(--rose600) '+(cat.percent*3.6)+'deg, var(--rose100) 0)">'+
          '<div class="ring-inner" style="width:56px;height:56px;font-weight:800;font-size:15px;color:var(--rose900)">'+cat.percent+'%</div></div>'+
        '<div style="font-weight:700;font-size:12.5px;margin-top:8px">'+esc(cat.label)+'</div>'+
        '<div style="font-size:11px;color:var(--muted)">'+cat.completedCount+'/'+cat.total+'</div>'+
      '</button>').join('')+
    '</div>'+
    (selected ? '<div class="card" style="margin-top:14px"><div style="font-weight:700;margin-bottom:8px">'+esc(selected.label)+' items</div>'+
      selected.items.map(it=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid oklch(93% 0.01 20)">'+
        '<div><div style="font-weight:700;font-size:13px">'+esc(it.subtype)+' <span style="font-weight:500;color:var(--muted)">— '+esc(it.title)+'</span></div>'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:2px">Latest: '+esc(it.latestResult)+' · By '+esc(it.latestAssessor)+'</div></div>'+
        '<span class="chip" style="background:'+it.meta.bg+';color:'+it.meta.fg+'">'+it.meta.label+'</span></div>').join('')+
      '</div>' : '')+
    '</div></div>';
}

function renderSubmitForm(){
  const f = S.submitForm;
  const assessmentOptions = BOOT.assessments.filter(a=>a.category===f.category);
  return '<div class="card" style="max-width:820px">'+
    '<h2 style="margin:0 0 4px;font-size:19px">Submit an assessment request</h2>'+
    '<div style="color:var(--muted);font-size:13px;margin-bottom:16px">Send a case to a faculty assessor for entrustment scoring.</div>'+
    '<div class="field-grid">'+
      '<div><label class="field-label">Training year</label><select id="sfTrainingYear"><option value="1" '+(f.trainingYear=='1'?'selected':'')+'>F1</option><option value="2" '+(f.trainingYear=='2'?'selected':'')+'>F2</option><option value="3" '+(f.trainingYear=='3'?'selected':'')+'>F3</option></select></div>'+
      '<div><label class="field-label">Category</label><select id="sfCategory">'+CATEGORIES.map(c=>'<option value="'+c+'" '+(f.category===c?'selected':'')+'>'+BOOT.categoryLabel[c]+'</option>').join('')+'</select></div>'+
      '<div style="grid-column:1/-1"><label class="field-label">Assessment item</label><select id="sfAssessment">'+assessmentOptions.map(a=>'<option value="'+a.id+'" '+(f.assessmentId===a.id?'selected':'')+'>'+esc(a.subtype)+' — '+esc(a.title)+'</option>').join('')+'</select></div>'+
      '<div style="grid-column:1/-1"><label class="field-label">Assessor</label><select id="sfAssessor">'+facultyOptionsHtml(f.assessorId)+'</select></div>'+
    '</div>'+
    '<div style="font-size:13px;font-weight:700;color:var(--rose900);margin:18px 0 8px">Patient information</div>'+
    '<div class="field-grid">'+
      '<div><label class="field-label">Patient name</label><input id="sfPatientName" value="'+esc(f.patientName)+'" placeholder="ชื่อผู้ป่วย"></div>'+
      '<div><label class="field-label">HN</label><input id="sfHn" value="'+esc(f.hn)+'"></div>'+
      '<div><label class="field-label">Diagnosis</label><input id="sfDiagnosis" value="'+esc(f.diagnosis)+'"></div>'+
      '<div><label class="field-label">Date</label><input type="date" id="sfCaseDate" value="'+esc(f.caseDate)+'"></div>'+

    '<div style="flex:1;min-width:220px"><label class="field-label">Signed in as</label>'+
    '<select id="facultySelect">'+facultyOptionsHtml(S.activeFacultyId)+'</select></div>'+
    '<div class="tabbar">'+
      '<button data-facultytab="queue" class="tab '+(S.facultyTab==='queue'?'active':'')+'">Grading Queue</button>'+
      '<button data-facultytab="progress" class="tab '+(S.facultyTab==='progress'?'active':'')+'">Fellows Progress</button>'+
    '</div></div>';

  let html = '<h2 style="font-size:19px;margin:0 0 6px">Grading queue <span style="font-weight:500;color:var(--muted);font-size:14px">— '+items.length+' waiting for you</span></h2>'+
    '<div style="color:var(--muted);font-size:13px;margin-bottom:14px">Grading happens through the one-time link emailed to you for each request — patient details aren\'t shown here until then.</div>';
  if (!items.length) html += '<div class="empty">No pending assessments assigned to you. 🎉</div>';
  else html += items.map(q => {
    const a = BOOT.assessments.find(x=>x.id===q.assessmentId) || {};
    const fellow = BOOT.fellows.find(x=>x.id===q.fellowId) || {};
    return '<div class="card" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">'+
      '<div><div style="font-size:11.5px;font-weight:700;color:var(--rose600);text-transform:uppercase;letter-spacing:.03em">'+BOOT.categoryLabel[q.category]+' · '+esc(a.subtype||'')+'</div>'+
      '<div style="font-weight:700;font-size:14.5px;margin-top:2px">'+esc(fellow.name)+'</div>'+
      '<div style="color:var(--muted);font-size:12.5px;margin-top:2px">Requested '+fmtDate(q.createdAt)+'</div></div>'+
      '<div style="font-size:12px;color:var(--muted)">Check your email for the grading link</div></div>';

}

function renderAllFellowsProgress(){
  return '<h2 style="font-size:19px;margin:0 0 12px">All fellows</h2>'+
    BOOT.fellows.map(f=>{
      const d = computeFellowDashboard(f.id);
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px">'+
        '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14.5px">'+esc(f.name)+'</div>'+
        '<div style="color:var(--muted);font-size:12.5px">F'+esc(f.year)+' · '+d.completed+'/'+d.total+' completed</div></div>'+

/* ---------- Admin ---------- */
function renderAdmin(){
  const allFellowDash = BOOT.fellows.map(f=>computeFellowDashboard(f.id));
  const adminStats = {
    fellows: BOOT.fellows.length, records: BOOT.submissions.length,
    pending: BOOT.submissions.filter(s=>s.status==='PENDING').length,
    avgPercent: allFellowDash.length ? Math.round(allFellowDash.reduce((a,d)=>a+d.percent,0)/allFellowDash.length) : 0
  };
  let html = '<div class="tabbar" style="margin-bottom:16px">'+
    ['overview','records','people'].map(t=>'<button data-admintab="'+t+'" class="tab '+(S.adminTab===t?'active':'')+'">'+({overview:'Program Overview',records:'All Records',people:'Fellows & Faculty'}[t])+'</button>').join('')+
    '</div>';

  if (S.adminTab==='overview'){
    html += '<div class="stat-grid">'+
      '<div class="stat"><div class="stat-num" style="color:var(--rose900)">'+adminStats.fellows+'</div><div class="stat-label">Fellows</div></div>'+
      '<div class="stat"><div class="stat-num" style="color:var(--rose900)">'+adminStats.records+'</div><div class="stat-label">Total records</div></div>'+
      '<div class="stat"><div class="stat-num" style="color:var(--amber-fg)">'+adminStats.pending+'</div><div class="stat-label">Pending review</div></div>'+
      '<div class="stat"><div class="stat-num" style="color:var(--green-fg)">'+adminStats.avgPercent+'%</div><div class="stat-label">Avg. completion</div></div>'+
    '</div><h2 style="font-size:17px;margin:0 0 10px">Fellow overview</h2>'+
    BOOT.fellows.map((f,i)=>{ const d=allFellowDash[i];
      return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px">'+
        '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14.5px">'+esc(f.name)+'</div>'+
        '<div style="color:var(--muted);font-size:12.5px">F'+esc(f.year)+' · '+d.completed+'/'+d.total+' completed</div></div>'+
        '<div style="display:flex;align-items:center;gap:12px"><div class="progress-track" style="width:160px"><div class="progress-fill" style="width:'+d.percent+'%"></div></div>'+
        '<b style="min-width:38px;text-align:right;color:var(--rose900)">'+d.percent+'%</b>'+
        '<button data-checkpoint="'+f.id+'" class="btn-ghost">Freeze checkpoint</button></div></div>';
    }).join('');
  } else if (S.adminTab==='records'){
    const sorted = [...BOOT.submissions].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    html += '<div class="card" style="padding:8px;overflow:auto"><table><thead><tr><th>Status</th><th>Date</th><th>Fellow</th><th>Item</th><th>Assessor</th><th>Result</th><th>PDF</th></tr></thead><tbody>'+
      sorted.map(sub=>{
        const a = BOOT.assessments.find(x=>x.id===sub.assessmentId)||{};
        const fellow = BOOT.fellows.find(x=>x.id===sub.fellowId)||{};
        let meta;
        if (sub.status==='PENDING') meta = STATUS_META.PENDING;
        else if (sub.category==='COMMU') meta = sub.globalResult==='PASS'?STATUS_META.COMPLETED:STATUS_META.NOT_COMPLETED;
        else meta = Number(sub.globalResult) >= BOOT.completionLevel ? STATUS_META.COMPLETED : STATUS_META.NOT_COMPLETED;
        const result = sub.status==='GRADED' ? (sub.category==='COMMU'?sub.globalResult:('Level '+sub.globalResult)) : '—';
        return '<tr><td><span class="chip" style="background:'+meta.bg+';color:'+meta.fg+'">'+meta.label+'</span></td>'+
          '<td style="color:var(--muted)">'+fmtDate(sub.createdAt)+'</td><td style="font-weight:600">'+esc(fellow.short||fellow.name)+'</td>'+
          '<td>'+BOOT.categoryLabel[sub.category]+' · '+esc(a.subtype||'')+'</td><td>'+esc(sub.assessorName)+'</td><td>'+esc(result)+'</td>'+
          '<td>'+(sub.status==='GRADED'?'<button data-regenpdf="'+sub.id+'" class="btn-ghost">Regenerate</button>':'')+'</td></tr>';
      }).join('')+
    '</tbody></table></div>';
  } else {
    html += renderPeopleAdmin();
  }
  return html;
}

function renderPeopleAdmin(){
  let html = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0;font-size:15px">Fellows</h3><button id="btnAddFellow" class="btn-ghost">+ Add fellow</button></div>';
  html += BOOT.fellows.map(f=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid oklch(93% 0.01 20)">'+
    '<div><b>'+esc(f.name)+'</b> · F'+esc(f.year)+' <span style="color:var(--muted);font-size:12px">'+esc(f.email||'')+'</span></div>'+
    '<button data-editfellow="'+f.id+'" class="link-btn">Edit</button></div>').join('') || '<div style="color:var(--muted);font-size:13px">No fellows yet.</div>';
  html += '</div>';
  html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="margin:0;font-size:15px">Faculty</h3><button id="btnAddFaculty" class="btn-ghost">+ Add faculty</button></div>';
  html += BOOT.faculty.map(f=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid oklch(93% 0.01 20)">'+
    '<div><b>'+esc(f.name)+'</b> <span style="color:var(--muted);font-size:12px">'+esc(f.email||'')+'</span></div>'+
    '<button data-editfaculty="'+f.id+'" class="link-btn">Edit</button></div>').join('') || '<div style="color:var(--muted);font-size:13px">No faculty yet.</div>';

/* ---------- Person modal (add/edit fellow or faculty, with signature pad) ---------- */
function renderModal(){
  if (!S.adminModal) return '';
  const m = S.adminModal;
  const existing = m.kind==='fellow' ? BOOT.fellows.find(f=>f.id===m.id) : BOOT.faculty.find(f=>f.id===m.id);
  return '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">'+
    '<h3 style="margin:0 0 12px">'+(existing?'Edit ':'Add ')+(m.kind==='fellow'?'fellow':'faculty')+'</h3>'+
    '<label class="field-label">Name</label><input id="mName" value="'+esc(existing?existing.name:'')+'">'+
    '<label class="field-label" style="display:block;margin-top:10px">Short name</label><input id="mShort" value="'+esc(existing?existing.short:'')+'">'+
    '<label class="field-label" style="display:block;margin-top:10px">Email</label><input id="mEmail" type="email" value="'+esc(existing?existing.email:'')+'">'+
    (m.kind==='fellow' ? '<label class="field-label" style="display:block;margin-top:10px">Training year</label><select id="mYear">'+['1','2','3'].map(y=>'<option value="'+y+'" '+((existing?String(existing.year):'1')===y?'selected':'')+'>F'+y+'</option>').join('')+'</select>' : '')+
    '<label class="field-label" style="display:block;margin-top:10px">Signature <span style="font-weight:400;text-transform:none">(kept on file, used on PDFs)</span></label>'+
    '<canvas id="mSigCanvas" class="sig-canvas"></canvas>'+
    '<div style="margin-top:6px"><button id="mSigClear" class="btn-ghost">Clear signature</button>'+(existing&&existing.hasSignature?' <span style="font-size:12px;color:var(--muted)">Signature on file — leave blank to keep it</span>':'')+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:16px"><button id="mSave" class="btn">Save</button><button id="mCancel" class="btn-ghost">Cancel</button></div>'+
  '</div></div>';
}

function setupSigCanvas(canvasEl){
  const ctx = canvasEl.getContext('2d');
  function resize(){ const r=canvasEl.getBoundingClientRect(); canvasEl.width=r.width*2; canvasEl.height=r.height*2; ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#23151f'; }
  resize();
  let drawing=false, last=null;
  function pos(e){ const r=canvasEl.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvasEl.addEventListener('mousedown',start); canvasEl.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvasEl.addEventListener('touchstart',start); canvasEl.addEventListener('touchmove',move); canvasEl.addEventListener('touchend',end);
  canvasEl._clear = () => ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
  canvasEl._isEmpty = () => { const d=ctx.getImageData(0,0,canvasEl.width,canvasEl.height).data; for(let i=3;i<d.length;i+=4){ if(d[i]!==0) return false; } return true; };
}

/* ---------- events ---------- */
function bindEvents(){
  document.querySelectorAll('[data-role]').forEach(el=>el.onclick=()=>{ S.role=el.dataset.role; render(); });
  const fs = document.getElementById('fellowSelect'); if (fs) fs.onchange = e => { S.activeFellowId=e.target.value; resetSubmitForm(); render(); };
  const fac = document.getElementById('facultySelect'); if (fac) fac.onchange = e => { S.activeFacultyId=e.target.value; render(); };
  document.querySelectorAll('[data-fellowtab]').forEach(el=>el.onclick=()=>{ S.fellowTab=el.dataset.fellowtab; render(); });
  document.querySelectorAll('[data-facultytab]').forEach(el=>el.onclick=()=>{ S.facultyTab=el.dataset.facultytab; render(); });
  document.querySelectorAll('[data-admintab]').forEach(el=>el.onclick=()=>{ S.adminTab=el.dataset.admintab; render(); });
  document.querySelectorAll('[data-milestone]').forEach(el=>el.onclick=()=>{ S.milestoneView=el.dataset.milestone; render(); });
  document.querySelectorAll('[data-radial]').forEach(el=>el.onclick=()=>{ S.radialCategory = S.radialCategory===el.dataset.radial ? null : el.dataset.radial; render(); });

  const sfCategory = document.getElementById('sfCategory');
  if (sfCategory) sfCategory.onchange = e => { S.submitForm.category = e.target.value; const first = BOOT.assessments.find(a=>a.category===e.target.value); S.submitForm.assessmentId = first?first.id:''; render(); };
  ['sfTrainingYear','sfAssessment','sfAssessor','sfPatientName','sfHn','sfDiagnosis','sfCaseDate','sfLocation','sfReflection'].forEach(id=>{
    const el = document.getElementById(id); if (!el) return;
    const map = { sfTrainingYear:'trainingYear', sfAssessment:'assessmentId', sfAssessor:'assessorId', sfPatientName:'patientName', sfHn:'hn', sfDiagnosis:'diagnosis', sfCaseDate:'caseDate', sfLocation:'location', sfReflection:'reflection' };
    const evt = el.tagName === 'SELECT' ? 'onchange' : 'oninput';
    el[evt] = e => { S.submitForm[map[id]] = e.target.value; };
  });
  const btnSubmit = document.getElementById('btnSubmitRequest');
  if (btnSubmit) btnSubmit.onclick = onSubmitRequest;

  const btnExport = document.getElementById('btnExportPortfolio');
  if (btnExport) btnExport.onclick = () => {
    setBusy(true);
    call('api_exportPortfolio', S.activeFellowId).then(res => { setBusy(false); window.open(res.url, '_blank'); showToast('Portfolio exported'); })
      .catch(err => { setBusy(false); showToast('Error: '+(err.message||err)); });
  };

  document.querySelectorAll('[data-checkpoint]').forEach(el=>el.onclick=()=>{
    const label = prompt('Checkpoint label (e.g. 6mo, 1yr):','');
    if (label===null) return;
    call('api_generateCheckpoint', el.dataset.checkpoint, label).then(()=>showToast('Checkpoint saved')).catch(err=>showToast('Error: '+(err.message||err)));
  });
  document.querySelectorAll('[data-regenpdf]').forEach(el=>el.onclick=()=>{
    setBusy(true);
    call('api_regeneratePdf', el.dataset.regenpdf).then(res=>{ setBusy(false); window.open(res.url,'_blank'); }).catch(err=>{ setBusy(false); showToast('Error: '+(err.message||err)); });
  });

  const btnAddFellow = document.getElementById('btnAddFellow'); if (btnAddFellow) btnAddFellow.onclick = () => { S.adminModal = {kind:'fellow', id:null}; render(); };
  const btnAddFaculty = document.getElementById('btnAddFaculty'); if (btnAddFaculty) btnAddFaculty.onclick = () => { S.adminModal = {kind:'faculty', id:null}; render(); };
  document.querySelectorAll('[data-editfellow]').forEach(el=>el.onclick=()=>{ S.adminModal={kind:'fellow', id:el.dataset.editfellow}; render(); });
  document.querySelectorAll('[data-editfaculty]').forEach(el=>el.onclick=()=>{ S.adminModal={kind:'faculty', id:el.dataset.editfaculty}; render(); });

  const sigCanvas = document.getElementById('mSigCanvas');
  if (sigCanvas) { setupSigCanvas(sigCanvas); const clearBtn=document.getElementById('mSigClear'); if(clearBtn) clearBtn.onclick=()=>sigCanvas._clear(); }
  const mCancel = document.getElementById('mCancel'); if (mCancel) mCancel.onclick = () => { S.adminModal=null; render(); };
  const mSave = document.getElementById('mSave'); if (mSave) mSave.onclick = onSavePerson;
}

function onSubmitRequest(){
  const f = S.submitForm;
  if (!f.assessmentId || !f.assessorId || !f.patientName || !f.hn || !f.caseDate) { showToast('Please complete all required fields'); return; }
  setBusy(true);
  call('api_submitRequest', f).then(() => {
    setBusy(false); showToast('Assessment request sent to assessor');
    return call('api_bootstrap');
  }).then(data => { if (data) { BOOT = data; resetSubmitForm(); render(); } })
    .catch(err => { setBusy(false); showToast('Error: '+(err.message||err)); });
}

function onSavePerson(){
  const m = S.adminModal;
  const name = document.getElementById('mName').value.trim();
  const short = document.getElementById('mShort').value.trim();
  const email = document.getElementById('mEmail').value.trim();
  if (!name || !email) { showToast('Name and email are required'); return; }
  const sigCanvas = document.getElementById('mSigCanvas');
  const signaturePng = (sigCanvas && !sigCanvas._isEmpty()) ? sigCanvas.toDataURL('image/png') : '';
  const payload = { id: m.id, name, shortName: short, email, signaturePng };
  setBusy(true);
  if (m.kind==='fellow') {
    payload.trainingYear = document.getElementById('mYear').value.trim() || '1';
    call('api_adminUpsertFellow', payload).then(()=>{ setBusy(false); S.adminModal=null; showToast('Saved'); return call('api_bootstrap'); })
      .then(data=>{ if(data){BOOT=data; render();} }).catch(err=>{ setBusy(false); showToast('Error: '+(err.message||err)); });
  } else {
    call('api_adminUpsertFaculty', payload).then(()=>{ setBusy(false); S.adminModal=null; showToast('Saved'); return call('api_bootstrap'); })
      .then(data=>{ if(data){BOOT=data; render();} }).catch(err=>{ setBusy(false); showToast('Error: '+(err.message||err)); });
  }
}

boot();
</script>
